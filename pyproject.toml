[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanctions-screen"
version = "0.4.0"
description = "Offline screening of names against public sanctions lists (OFAC, UN, EU, UK)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paulo Marques" }]
keywords = ["sanctions", "screening", "compliance", "aml", "name-matching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "rapidfuzz>=3.5",
    "jellyfish>=1.0",
    "lxml>=5.0",
    "typer>=0.12",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "orjson>=3.9",
]

[project.urls]
Repository = "https://github.com/paulojoseph/sanctions-screen"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
sanctions-screen = "sanctions_screen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctions_screen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "B007"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
